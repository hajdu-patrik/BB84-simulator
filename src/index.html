<!doctype html>
<html lang="hu" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BB84-szimulátor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-20 -20 40 40'%3E%3Ccircle r='20' fill='%232152c9'/%3E%3Cpath d='M-7-7L7 7M-7 7L7-7' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script>try { if (localStorage.getItem('bb84-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch { /* világos marad */ }</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/rail.css">
<link rel="stylesheet" href="styles/stage.css">
<link rel="stylesheet" href="styles/results.css">
<link rel="stylesheet" href="styles/responsive.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pol" viewBox="-12 -12 24 24">
    <path d="M-10 0H10M-10 0l4-3.2M-10 0l4 3.2M10 0l-4-3.2M10 0l-4 3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<header class="site-head">
  <div class="wrap">
    <svg class="mark" viewBox="-20 -20 40 40" aria-hidden="true">
      <circle r="19"/>
      <path d="M-10 0H10M-10 0l4-3.2M-10 0l4 3.2M10 0l-4-3.2M10 0l-4 3.2" transform="rotate(-45)"/>
    </svg>
    <div class="brand">
      <h1 data-t="title"></h1>
      <p data-t="tagline"></p>
    </div>
    <div class="site-tools">
      <div class="seg" role="group" data-t-aria="language">
        <button type="button" data-lang="hu">HU</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" id="btn-theme" class="icon">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel settings" data-t-aria="settings">
    <label><span data-t="qubits"></span>
      <select id="in-n">
        <option>64</option>
        <option>96</option>
        <option>128</option>
      </select>
    </label>
    <label class="check eve"><input type="checkbox" role="switch" id="in-eve" autocomplete="off"> <span data-t="eveToggle"></span></label>
    <label id="rate-field"><span data-t="intercepted"></span>
      <select id="in-rate">
        <option value="1">100%</option>
        <option value="0.75">75%</option>
        <option value="0.5">50%</option>
        <option value="0.25">25%</option>
      </select>
    </label>
    <div class="settings-end">
      <label class="check"><input type="checkbox" role="switch" id="in-motion" autocomplete="off" checked> <span data-t="animations"></span></label>
      <button type="button" id="btn-reroll" data-t="reroll"></button>
    </div>
  </section>

  <nav class="rail-wrap" data-t-aria="rail">
    <ol class="rail" id="rail"></ol>
    <p class="rail-label" id="rail-label" aria-hidden="true"></p>
  </nav>

  <section class="panel">
    <div class="stage">
      <div class="bench-box"><svg id="bench" viewBox="0 0 1000 225" role="img" data-t-aria="bench">
        <path class="beam" id="beam" d="M180 80H820"/>
        <path id="trail-a" class="trail" d="M180 80H180"/>
        <path id="trail-b" class="trail tampered" d="M585 80H585"/>
        <text id="beam-label" class="tag" x="500" y="64" text-anchor="middle" data-t="quantumChannel"></text>

        <path class="classical" id="classical" d="M95 140V185H905V140"/>
        <path class="classical tap eve-part" id="tap" d="M500 140V185"/>
        <text id="public-label" class="tag" x="500" y="214" text-anchor="middle"></text>

        <g id="alice-box" transform="translate(10 20)">
          <rect width="170" height="120" rx="10"/>
          <text x="18" y="34" class="who" id="name-alice"></text>
          <text x="18" y="68" class="val" id="a-bit"></text>
          <text x="18" y="98" class="val" id="a-basis"></text>
        </g>

        <g class="eve eve-part" id="eve-box" transform="translate(415 20)">
          <rect width="170" height="120" rx="10"/>
          <text x="18" y="34" class="who" id="name-eve"></text>
          <text x="18" y="68" class="val" id="e-basis"></text>
          <text x="18" y="98" class="val" id="e-bit"></text>
        </g>

        <g id="bob-box" transform="translate(820 20)">
          <rect width="170" height="120" rx="10"/>
          <text x="18" y="34" class="who" id="name-bob"></text>
          <text x="18" y="68" class="val" id="b-basis"></text>
          <text x="18" y="98" class="val" id="b-bit"></text>
        </g>

        <g id="photon" class="photon" visibility="hidden">
          <circle r="17"/>
          <g id="photon-pol"><path d="M-12 0H12M-12 0l5-4M-12 0l5 4M12 0l-5-4M12 0l-5 4"/></g>
        </g>
        <g id="packet" class="packet" visibility="hidden">
          <rect id="packet-box" x="-56" y="-15" width="112" height="30" rx="15"/>
          <text id="packet-label" y="5.5" text-anchor="middle"></text>
        </g>
      </svg></div>

      <article class="narration" id="narration" aria-live="polite" aria-atomic="true">
        <h2 id="narr-title"></h2>
        <div id="narr-body"></div>
      </article>
    </div>

    <div class="transport" role="group" data-t-aria="transport">
      <button type="button" id="btn-next" class="primary" data-t="next"></button>
      <button type="button" id="btn-back" data-t="back"></button>
      <button type="button" id="btn-phase" data-t="nextPhase"></button>
      <button type="button" id="btn-reset" data-t="reset"></button>
      <span class="progress" id="progress"></span>
    </div>
  </section>

  <dl class="panel metrics">
    <div class="metric" id="m-sent"><dt data-t="mSent"></dt><dd></dd></div>
    <div class="metric" id="m-match"><dt data-t="mMatch"></dt><dd></dd></div>
    <div class="metric" id="m-err"><dt data-t="mErr"></dt><dd></dd></div>
    <div class="metric" id="m-qber">
      <dt id="qber-label"></dt><dd></dd>
      <dd class="meter" id="meter" aria-hidden="true"><i id="meter-fill"></i><u id="meter-mark"></u></dd>
    </div>
    <div class="metric" id="m-key"><dt data-t="mKey"></dt><dd></dd></div>
  </dl>

  <section class="panel">
    <h2 class="panel-head" data-t="panelQubits"></h2>
    <div class="panel-body">
      <div class="ledger-scroll" id="ledger-scroll" role="region" tabindex="0" data-t-aria="scroll">
        <table id="ledger" data-t-aria="table"></table>
      </div>
      <p class="legend" id="legend"></p>
    </div>
  </section>

  <section class="panel" id="keys" data-t-aria="keys"></section>
</main>

<footer class="site-foot">
  <div class="wrap">
    <span>Hajdú Patrik Zsolt</span>
  </div>
</footer>

<script src="engine/quantum.js"></script>
<script src="engine/random.js"></script>
<script src="engine/postprocess.js"></script>
<script src="engine/protocol.js"></script>
<script src="ui/i18n.js"></script>
<script src="ui/core.js"></script>
<script src="ui/rail.js"></script>
<script src="ui/bench.js"></script>
<script src="ui/narration.js"></script>
<script src="ui/ledger.js"></script>
<script src="ui/results.js"></script>
<script src="ui/main.js"></script>
</body>
</html>
